apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mlflow-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/redhox/k8s.git'
    targetRevision: main
    path: mlflow/dev
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: mlflow
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
