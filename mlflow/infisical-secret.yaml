apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: mlflow-infisical-sync
  namespace: mlflow
spec:
  hostAPI: "https://infisical.morgan-coulm.fr/api"
  resyncInterval: 60
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: "<SLUG_PROJET_INFISICAL>"
        envSlug: "prod"
        secretsPath: "/"
      credentialsRef:
        secretName: infisical-auth
        secretNamespace: mlflow
  managedSecretReference:
    secretName: mlflow-managed-secret
    secretNamespace: mlflow
