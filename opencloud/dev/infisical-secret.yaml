apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret

metadata:
  name: opencloud-infisical-sync
  namespace: opencloud

spec:
  hostAPI: "https://infisical.morgan-coulm.fr/api"

  resyncInterval: 60

  authentication:
    universalAuth:
      secretsScope:
        projectSlug: "opencloud-dul-d"
        envSlug: "dev"
        secretsPath: "/"

      credentialsRef:
        secretName: infisical-auth
        secretNamespace: opencloud

  managedSecretReference:
    secretName: opencloud-managed-secret
    secretNamespace: opencloud
